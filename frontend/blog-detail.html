<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - JERAD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/blog-detail.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <main class="main-container">

        <!-- Hero Section-->
        <section class="blog-hero" id="blog-hero">
            <div class="blog-hero-content">
                <h1 class="blog-title" id="blog-title">¿LA OBSESIÓN VENCE AL TALENTO?</h1>
                <div class="blog-meta">
                    <div class="blog-author">
                        <i class="fas fa-user"></i>
                        <span id="blog-author">RUDY GOMEZ</span>
                    </div>
                    <div class="blog-date">
                        <i class="fas fa-calendar"></i>
                        <span id="blog-date">2024-06-10</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Main Content -->
        <main class="blog-main">
            <div class="blog-container">
                <!-- Social Share Sidebar -->
                <aside class="social-sidebar">
                    <div class="social-share">
                        <a href="#" class="social-btn facebook" id="share-facebook">
                            <i class="fab fa-facebook-f"></i>
                        </a>
                        <a href="#" class="social-btn twitter" id="share-twitter">
                            <i class="fab fa-twitter"></i>
                        </a>
                        <a href="#" class="social-btn linkedin" id="share-linkedin">
                            <i class="fab fa-linkedin-in"></i>
                        </a>
                        <a href="#" class="social-btn email" id="share-email">
                            <i class="fas fa-envelope"></i>
                        </a>
                    </div>
                </aside>

                <!-- Blog Content -->
                <article class="blog-content" id="blog-content">
                    <p id="blog-article-category">Esta es una prueba real papurris</p>
                    <!-- Dynamic blog content will be inserted here -->
                </article>
            </div>
        </main>

        <!-- Related Blogs Section -->
        <section class="related-blogs">
            <div class="related-container">
                <h2 class="section-title">Blogs Relacionados</h2>
                <div class="blogs-grid" id="related-blogs-grid">
                    <!-- Related blogs will be loaded dynamically here -->
                </div>
            </div>
        </section>
    </main>
    <div id="footer-placeholder"></div>
    <script src="js/blog-detail.js"></script>
</body>
</html>
