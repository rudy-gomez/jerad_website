<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - JERAD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <main class="main-container">

        <!-- Contact Section-->
        <section class="contact-section" id="contact-section">
            <div class="contact-content">
                <h1 class="contact-title" id="contact-title">Contáctanos</h1>
                <p class="contact-description" id="contact-description">Si tienes alguna pregunta o necesitas más información, no dudes en contactarnos.</p>
                <form class="contact-form" id="contact-form">
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" name="name" required>
                    <div class="required">
                        <div>
                            <label for="email">Teléfono:</label>
                            <input type="phone" id="phone" name="phone" required>
                        </div>
                        <div>
                            <label for="email">Correo Electrónico:</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                    </div>
                    <label for="message">Mensaje:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>

                    <button type="submit" class="submit-button">Enviar</button>
                </form>
            </div>
        </section>

    </main>
    <div id="footer-placeholder"></div>
    <script src="js/header.js"></script>
    <script src="js/layout.js"></script>
</html>
