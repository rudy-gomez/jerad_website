<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - JERAD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/contact.css">
</head>
<body class="contact-page">
    <div id="header-placeholder"></div>
    <main class="main-container">
        <section class="contact-section" id="contact-section">
            <div class="contact-wrapper">
                <!-- Header Section -->
                <div class="contact-header">
                    <div class="contact-breadcrumb">PÁGINA DE INICIO / CONTÁCTENOS</div>
                    <h1 class="contact-title">Contáctenos</h1>
                </div>

                <!-- Content Section -->
                <div class="contact-content">
                    <!-- Contact Information -->
                    <div class="contact-info">
                        <div class="info-section">
                            <h3 class="info-title">Nuestro enfoque</h3>
                            <div class="info-item">
                                <i class="fas fa-lightbulb"></i>
                                <span>Ideas frescas y soluciones innovadoras</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-handshake"></i>
                                <span>Atención personalizada y cercana</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-rocket"></i>
                                <span>Pasión por la tecnología</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-heart"></i>
                                <span>Compromiso con cada proyecto</span>
                            </div>
                        </div>

                        <div class="info-section">
                            <h3 class="info-title">Horarios de atención</h3>
                            <div class="info-item">
                                <i class="fas fa-clock"></i>
                                <span>Lun - Vie: 9:00 AM - 6:00 PM<br>Sáb: 9:00 AM - 2:00 PM</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-headset"></i>
                                <span>Soporte técnico 24/7</span>
                            </div>
                        </div>
                    </div>

                    <!-- Contact Form -->
                    <div class="contact-form-container">
                        <form class="contact-form" id="contact-form">
                            <div class="form-row">
                                <div class="form-group">
                                    <input type="text" id="name" name="name" class="form-input" placeholder=" " required>
                                    <label for="name" class="form-label">Nombre</label>
                                </div>
                                <div class="form-group">
                                    <input type="tel" id="phone" name="phone" class="form-input" placeholder=" " required>
                                    <label for="phone" class="form-label">Teléfono</label>
                                </div>
                            </div>
                            
                            <div class="form-group full-width">
                                <input type="email" id="email" name="email" class="form-input" placeholder=" " required>
                                <label for="email" class="form-label">Correo Electrónico</label>
                            </div>
                            
                            <div class="form-group full-width">
                                <textarea id="message" name="message" class="form-textarea" placeholder=" " required></textarea>
                                <label for="message" class="form-label">Mensaje</label>
                            </div>

                            <button type="submit" class="submit-button">
                                Enviar Formulario
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="footer-placeholder"></div>
    <script src="js/header.js"></script>
    <script src="js/layout.js"></script>
</body>
</html>
